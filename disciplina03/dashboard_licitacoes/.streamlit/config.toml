[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
font = "sans-serif"
baseRadius = "0.6rem"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
